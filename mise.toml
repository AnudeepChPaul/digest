[tools]
go = "1.27.1"
gotestsum = "1.13.0"
semver = "3.4.0"

[vars]
project = "digest"
version = "{{ read_file(path='.version') | trim }}"
description = "Digest your day to day work without acidity."

[tasks.state]
description = "Print all vars as JSON"
quiet = true
run = "echo '{{ vars | json_encode() }}' | jq ."

[tasks.bump]
description = "Bump .version with semver"
quiet = true
usage = 'arg "<bump>" default="patch" { choices "patch" "minor" "major" }'
run = '''
current_version=$(cat .version)
next_version=$(semver bump "$usage_bump" "$current_version")
printf '%s\n' "$next_version" > .version
printf '\033[33m↑\033[0m version \033[2m%s\033[0m → \033[1m%s\033[0m\n' "$current_version" "$next_version"
'''

[tasks."release:level"]
description = "Print the release level the commits since the last release call for (major, minor, patch or none)"
quiet = true
run = "go run ./cmd/release level"

[tasks.changelog]
description = "Add the current .version section to CHANGELOG.md from the commits since the last release (run by the release workflow)"
quiet = true
run = "go run ./cmd/release changelog \"$(cat .version)\""

[tasks."release:notes"]
description = "Print the latest CHANGELOG.md section"
quiet = true
run = "go run ./cmd/release notes"

[tasks."release:commit"]
description = "Bump .version and commit it as a release; pushing it releases"
quiet = true
usage = 'arg "[level]" help="patch, minor or major; defaults to what release:level prints" { choices "patch" "minor" "major" }'
run = '''
release_level="${usage_level:-$(mise run release:level)}"
if [ "$release_level" = "none" ]; then
  echo "no feat, fix or perf commits since the last release" >&2
  exit 1
fi
mise run bump "$release_level"
git commit -q -m "chore: release v$(cat .version)" -- .version
printf '\033[32m✓\033[0m committed \033[1mv%s\033[0m; git push to release\n' "$(cat .version)"
'''

[tasks.test]
description = "Run tests"
quiet = true
run = "gotestsum --format testname ./..."

[tasks.vet]
description = "Run go vet"
quiet = true
run = "go vet ./..."

[tasks.build]
description = "Build a dev {{vars.project}} into ~/.config/bin"
depends = ["vet", "test"]
quiet = true
run = '''
binary_path=~/.config/bin/digest
build_version="$(cat .version)+$(git rev-parse --short HEAD)"
printf '\033[36m▸\033[0m building {{vars.project}} \033[1mv%s\033[0m\n' "$build_version"
go build -trimpath -ldflags "-s -w -X github.com/AnudeepChPaul/digest/pkg/tui.appVersion=$build_version" -o "$binary_path" ./cmd/digest
binary_size=$(stat -f %z "$binary_path" | awk '{ printf "%.1f MB", $1 / 1048576 }')
printf '\033[32m✓\033[0m built %s \033[2m(%s)\033[0m\n' "$binary_path" "$binary_size"
'''

[tasks.dist]
description = "Build release archives for macOS arm64 and amd64 into dist/"
quiet = true
run = '''
set -eu
release_version=$(cat .version)
rm -rf dist
mkdir -p dist
for arch in arm64 amd64; do
  staging_dir="dist/digest-$release_version-darwin-$arch"
  mkdir -p "$staging_dir"
  GOOS=darwin GOARCH=$arch CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X github.com/AnudeepChPaul/digest/pkg/tui.appVersion=$release_version" -o "$staging_dir/digest" ./cmd/digest
  cp LICENSE README.md "$staging_dir/"
  tar -czf "$staging_dir.tar.gz" -C dist "$(basename "$staging_dir")"
  rm -rf "$staging_dir"
done
(cd dist && shasum -a 256 *.tar.gz > checksums.txt)
ls -lh dist
'''

[tasks.tap]
description = "Point the Homebrew formula in $TAP_DIR at the current .version tag"
quiet = true
run = '''
set -eu
formula_path="${TAP_DIR:?set TAP_DIR to the homebrew-tap checkout}/Formula/digest.rb"
release_tag="v$(cat .version)"
tarball_url="https://github.com/AnudeepChPaul/digest/archive/refs/tags/$release_tag.tar.gz"
tarball_sha=$(curl -fsSL "$tarball_url" | shasum -a 256 | cut -d' ' -f1)
sed -i '' -E "s#archive/refs/tags/v[^/]+\.tar\.gz#archive/refs/tags/$release_tag.tar.gz#; s/sha256 \"[0-9a-f]+\"/sha256 \"$tarball_sha\"/" "$formula_path"
printf '\033[32m✓\033[0m formula points at %s (%s)\n' "$release_tag" "$tarball_sha"
'''

[tasks.bench]
description = "Print performance benchmarks at 1, 100, 1k and 10k notes"
quiet = true
run = "go run ./cmd/bench run"

[tasks."bench:full"]
description = "Print performance benchmarks up to 100k notes"
quiet = true
run = "go run ./cmd/bench run --sizes 1,100,1000,10000,100000"

[tasks."bench:record"]
description = "Measure benchmarks and record them in docs/benchmark/benchmark.md (used by the release workflow)"
quiet = true
run = "go run ./cmd/bench record"
