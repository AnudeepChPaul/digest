name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, defaults to the latest tag
        required: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    outputs:
      tag: ${{ steps.tag.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          release_tag="${INPUT_TAG:-$(git tag --list 'v*' --sort=-v:refname | head -n 1)}"
          if [ -z "$release_tag" ]; then
            echo "no tag to release" >&2
            exit 1
          fi
          git checkout "refs/tags/$release_tag"
          echo "name=$release_tag" >> "$GITHUB_OUTPUT"
      - uses: jdx/mise-action@v5
      - run: mise run dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mise run release:notes > dist/release-notes.md
          gh release create "${{ steps.tag.outputs.name }}" dist/*.tar.gz dist/checksums.txt --title "digest ${{ steps.tag.outputs.name }}" --notes-file dist/release-notes.md
      - run: |
          curl -fsSL "https://proxy.golang.org/github.com/achandrapaul/digest/@v/${{ steps.tag.outputs.name }}.info"
      - uses: actions/checkout@v7
        with:
          repository: achandrapaul/homebrew-tap
          path: homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
      - env:
          TAP_DIR: homebrew-tap
        run: |
          mise run tap
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "formula already points at ${{ steps.tag.outputs.name }}"
            exit 0
          fi
          git commit -am "digest ${{ steps.tag.outputs.name }}"
          git push origin HEAD:main

  benchmark:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.DIGEST_DEPLOY_KEY }}
      - uses: jdx/mise-action@v5
      - run: |
          release_tag="${{ needs.release.outputs.tag }}"
          mise run bench:record -- --version "$release_tag" --commit "$(git rev-list -n 1 "$release_tag" | cut -c1-7)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/benchmark/benchmark.md
          git commit -m "chore: benchmark $release_tag"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase --no-tags origin main
          done
          exit 1
