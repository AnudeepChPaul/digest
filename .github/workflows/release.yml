name: release

on:
  push:
    branches: [main]
    paths: [.version]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DIGEST_DEPLOY_KEY }}
      - uses: jdx/mise-action@v5
      - run: |
          mise run vet
          mise run test
      - run: mise run changelog
      - id: tag
        run: |
          release_tag="v$(cat .version)"
          echo "name=$release_tag" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -m "digest $release_tag" "$release_tag"
          git push origin "$release_tag"
      - run: mise run dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mise run release:notes > dist/release-notes.md
          gh release create "${{ steps.tag.outputs.name }}" dist/*.tar.gz dist/checksums.txt --title "digest ${{ steps.tag.outputs.name }}" --notes-file dist/release-notes.md
      - uses: actions/checkout@v7
        with:
          repository: AnudeepChPaul/homebrew-tap
          path: homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
      - env:
          TAP_DIR: homebrew-tap
        run: |
          mise run tap
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "formula already points at ${{ steps.tag.outputs.name }}"
            exit 0
          fi
          git commit -am "digest ${{ steps.tag.outputs.name }}"
          git push origin HEAD:main
      - run: |
          git add CHANGELOG.md
          git commit -m "chore: changelog ${{ steps.tag.outputs.name }}"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase --no-tags origin main
          done
          exit 1

  benchmark:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DIGEST_DEPLOY_KEY }}
      - id: touched
        run: |
          if git diff-tree --no-commit-id --name-only -r HEAD | grep -qx 'docs/benchmark/benchmark.md'; then
            echo "benchmark=true" >> "$GITHUB_OUTPUT"
          else
            echo "benchmark=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.touched.outputs.benchmark == 'false'
        uses: jdx/mise-action@v5
      - if: steps.touched.outputs.benchmark == 'false'
        run: |
          release_version="v$(cat .version)"
          mise run bench:record -- --version "$release_version" --commit "$(git rev-parse --short HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/benchmark/benchmark.md
          git commit -m "chore: benchmark $release_version"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase --no-tags origin main
          done
          exit 1
