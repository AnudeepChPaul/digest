name: bump

on:
  push:
    branches: [main]

concurrency:
  group: bump
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bump:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.DIGEST_DEPLOY_KEY }}
      - id: changed
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null && git diff --name-only "$BEFORE_SHA" HEAD | grep -qx '.version'; then
            echo "version=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.version == 'false'
        uses: jdx/mise-action@v5
      - if: steps.changed.outputs.version == 'false'
        run: |
          mise run vet
          mise run test
          mise run bump patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release v$(cat .version)"
          git push origin HEAD:main
